# Hope frontend — development (Docker Compose)
#
# Prerequisites:
#   - .env with APP_PORT, VITE_API_BASE_URL, VITE_FILE_SERVICE_URL (nginx proxies /files to this).
#   - Shared network must exist (created by hope-backend/docker-compose.db.yml):
#       cd ../hope-backend && docker compose --env-file .env.dev -f docker-compose.db.yml up -d dev-db-ontor
#   - file_uploader dev container running on the same network so the proxy target resolves:
#       cd ../file_uploader && docker compose --env-file .env.dev -f docker-compose.dev.yml up -d --build
#
# Run (detached, rebuild — required after .env changes):
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Verify file proxy in container logs:
#   docker compose -f docker-compose.dev.yml logs | findstr FILE_SERVICE
# Browser should request /files/... on the same host:port as the UI (not localhost:3085).
#
# Down (stop and remove containers):
#   docker compose -f docker-compose.dev.yml down
#
# Down (remove containers + volumes):
#   docker compose -f docker-compose.dev.yml down -v
#
# Logs:
#   docker compose -f docker-compose.dev.yml logs -f

name: ontor-frontend-dev

services:
  dev-frontend-ontor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/v1}
        # Empty = same-origin /files; nginx proxies at runtime (see FILE_SERVICE_UPSTREAM)
        VITE_FILE_SERVICE_URL: ""
        VITE_FILE_SERVICE_API_KEY: ${VITE_FILE_SERVICE_API_KEY:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    container_name: dev-frontend-ontor
    ports:
      - "${APP_PORT:-8085}:80"
    env_file:
      - .env
    environment:
      # Overrides .env — nginx proxies /files/ to the file_uploader container directly
      # over the shared network instead of round-tripping through a public IP.
      - VITE_FILE_SERVICE_URL=http://dev-app-file-uploader:3005
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - auth-network-dev

# Shared network created by hope-backend/docker-compose.db.yml — must be running before this file.
networks:
  auth-network-dev:
    external: true
    name: ontor-auth-network-dev
