# Hope frontend — development (Docker Compose)
#
# Prerequisites: copy env template → .env (VITE_*, APP_PORT). Default UI: http://localhost:8085
#
# Run (detached, rebuild):
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Down (stop and remove containers):
#   docker compose -f docker-compose.dev.yml down
#
# Down (remove containers + volumes):
#   docker compose -f docker-compose.dev.yml down -v
#
# Logs:
#   docker compose -f docker-compose.dev.yml logs -f

name: ontor-frontend-dev

services:
  dev-frontend-ontor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/v1}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    container_name: dev-frontend-ontor
    ports:
      - "${APP_PORT:-8085}:80"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
